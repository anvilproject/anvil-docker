steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - -c
      - |
        cd anvil-rstudio-r46
        tag=$(cat ./VERSION)
        out=$(docker pull ghcr.io/anvilproject/anvil-rstudio-r46:$tag)
        while [[ $out != *"up to date"* ]]; do
          out=$(docker pull ghcr.io/anvilproject/anvil-rstudio-r46:$tag);
          sleep 30;
        done
        docker tag ghcr.io/anvilproject/anvil-rstudio-r46:$tag us.gcr.io/broad-dsp-gcr-public/anvil-rstudio-r46:$tag
        docker push us.gcr.io/broad-dsp-gcr-public/anvil-rstudio-r46:$tag
timeout: 3600s
